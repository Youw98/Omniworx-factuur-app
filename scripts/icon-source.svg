<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1024" height="1024" rx="180" fill="#0C3C3A"/>
  <!-- OW Monogram: viewBox 0 0 400 300, scaled to 700px wide, centered -->
  <!-- scale = 700/400 = 1.75, height = 300*1.75 = 525, offset_x=(1024-700)/2=162, offset_y=(1024-525)/2=249.5 -->
  <g transform="translate(162, 250) scale(1.75)">
    <!-- Bottom half of O ring (behind W) -->
    <path d="M 15 150 A 115 115 0 0 1 245 150 L 200 150 A 70 70 0 0 1 60 150 Z" fill="#E7B260"/>
    <!-- W -->
    <path d="M 195 28 L 242 194 L 282 50 L 338 194 L 383 28 L 371 28 L 328 208 L 294 62 L 254 208 L 207 28 Z" fill="#E7B260"/>
    <!-- Top half of O ring (in front of W) -->
    <path d="M 245 150 A 115 115 0 0 0 15 150 L 60 150 A 70 70 0 0 0 200 150 L 245 150 Z" fill="#E7B260"/>
  </g>
</svg>
